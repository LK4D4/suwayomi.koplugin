name: Test

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: leafo/gh-actions-lua@v13
      with:
        luaVersion: "luajit-2.1"

    - uses: leafo/gh-actions-luarocks@v6

    - name: Show Lua environment
      run: |
        lua -v
        luarocks --version

    - name: Install dependencies
      run: |
        luarocks install busted
        luarocks install dkjson
        luarocks install luasocket
        luarocks install luasec
        luarocks install luacheck

    - name: Install gettext and native archive test dependencies
      run: |
        # These dependencies use Ubuntu packages, not the runner's third-party feeds.
        test -s /etc/apt/sources.list.d/ubuntu.sources
        apt_sources=(-o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
        sudo apt-get "${apt_sources[@]}" update
        sudo apt-get "${apt_sources[@]}" install -y gettext libarchive-dev

    - name: Run lint
      run: luacheck --codes spec suwayomi main.lua _meta.lua

    - name: Run tests
      run: busted spec

    - name: Check l10n catalogs
      run: ./scripts/check-l10n.sh

    - name: Smoke check release payload
      run: bash .github/scripts/stage-release-payload.sh
