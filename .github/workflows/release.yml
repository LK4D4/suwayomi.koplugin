name: Release

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

permissions:
  contents: write

jobs:
  build:
    name: Upload Release Asset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "luajit-2.1"

      - uses: leafo/gh-actions-luarocks@v6

      - name: Verify release tag matches metadata version
        run: luajit .github/scripts/check-release-version.lua _meta.lua "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: |
          luarocks install busted
          luarocks install dkjson
          luarocks install luasocket
          luarocks install luasec
          luarocks install luacheck

      - name: Install gettext tools
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Run lint
        run: luacheck --codes spec suwayomi main.lua _meta.lua

      - name: Run tests
        run: busted spec

      - name: Check l10n catalogs
        run: ./scripts/check-l10n.sh

      - name: Compile l10n catalogs
        run: ./scripts/compile-l10n.sh

      - name: Build project
        run: |
          asset_name="$(luajit .github/scripts/release-asset-name.lua _meta.lua)"
          bash .github/scripts/stage-release-payload.sh
          zip -r "$asset_name" suwayomi.koplugin/
          echo "RELEASE_ASSET_NAME=$asset_name" >> "$GITHUB_ENV"

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.RELEASE_ASSET_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
